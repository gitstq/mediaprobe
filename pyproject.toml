[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mediaprobe"
version = "1.0.0"
description = "Zero-dependency, offline-first media container inspector & auditor"
description-zh = "零依赖·离线优先的媒体容器元数据探查与审计引擎"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = ["media", "mp4", "mkv", "mp3", "metadata", "offline", "zero-dependency", "cli", "audit"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.0", "twine>=4.0"]

[project.scripts]
mediaprobe = "mediaprobe.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/mediaprobe"
Repository = "https://github.com/gitstq/mediaprobe"
Issues = "https://github.com/gitstq/mediaprobe/issues"

[tool.setuptools]
packages = ["mediaprobe", "mediaprobe.parsers"]

[tool.setuptools.package-data]
mediaprobe = ["py.typed"]
